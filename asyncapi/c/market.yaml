asyncapi: 3.0.0

info:
  title: 市场频道 WebSocket API
  version: 1.0.0
  description: 通过一个 WebSocket 连接订阅订单簿、Ticker、成交和价格变动。

defaultContentType: application/json

servers:
  test:
    host: ws-test.topblast.trade
    protocol: wss
    description: 测试环境

channels:
  publicMarket:
    address: /v1/public
    title: 市场频道
    description: 使用 `market:<marketId>` 订阅公共行情。
    messages:
      subscribe:
        $ref: "#/components/messages/Subscribe"
      unsubscribe:
        $ref: "#/components/messages/Unsubscribe"
      ping:
        $ref: "#/components/messages/Ping"
      pong:
        $ref: "#/components/messages/Pong"
      book:
        $ref: "#/components/messages/Book"
      ticker:
        $ref: "#/components/messages/Ticker"
      trade:
        $ref: "#/components/messages/Trade"
      priceChange:
        $ref: "#/components/messages/PriceChange"

operations:
  receiveMarketCommands:
    action: receive
    title: 接收客户端消息
    summary: 接收订阅、取消订阅和心跳消息。
    channel:
      $ref: "#/channels/publicMarket"
    messages:
      - $ref: "#/channels/publicMarket/messages/subscribe"
      - $ref: "#/channels/publicMarket/messages/unsubscribe"
      - $ref: "#/channels/publicMarket/messages/ping"
  sendMarketData:
    action: send
    title: 推送公共行情
    summary: 推送心跳响应和公共行情。
    channel:
      $ref: "#/channels/publicMarket"
    messages:
      - $ref: "#/channels/publicMarket/messages/pong"
      - $ref: "#/channels/publicMarket/messages/book"
      - $ref: "#/channels/publicMarket/messages/ticker"
      - $ref: "#/channels/publicMarket/messages/trade"
      - $ref: "#/channels/publicMarket/messages/priceChange"

components:
  messages:
    Subscribe:
      name: subscribe
      title: 订阅请求
      summary: 订阅指定市场的公共行情。
      payload:
        $ref: "#/components/schemas/SubscribeRequest"
      examples:
        - name: 订阅市场
          payload:
            action: subscribe
            channel: "market:1782787459278349659"
    Unsubscribe:
      name: unsubscribe
      title: 取消订阅请求
      summary: 取消指定市场的公共行情订阅。
      payload:
        $ref: "#/components/schemas/UnsubscribeRequest"
      examples:
        - name: 取消订阅市场
          payload:
            action: unsubscribe
            channel: "market:1782787459278349659"
    Ping:
      name: ping
      title: Ping
      summary: 发送连接心跳。
      payload:
        $ref: "#/components/schemas/Ping"
      examples:
        - name: Ping
          payload:
            type: PING
    Pong:
      name: pong
      title: Pong
      summary: 心跳响应。
      payload:
        $ref: "#/components/schemas/Pong"
      examples:
        - name: Pong
          payload:
            type: PONG
    Book:
      name: book
      title: 订单簿
      summary: 完整订单簿快照。
      payload:
        $ref: "#/components/schemas/BookMessage"
      examples:
        - name: 订单簿快照
          payload:
            eventType: book
            data:
              marketId: "1782787459278349659"
              tokenId: "1516616443"
              timestamp: 1782787459276
              bids:
                - price: "0.21"
                  size: "5"
              asks:
                - price: "0.3"
                  size: "5"
            timestamp: 1782787459276
    Ticker:
      name: ticker
      title: Ticker
      summary: 完整市场 Ticker 快照。
      payload:
        $ref: "#/components/schemas/TickerMessage"
      examples:
        - name: Ticker 快照
          payload:
            eventType: ticker
            data:
              marketId: "1782787459278349659"
              conditionId: "1515616443"
              eventId: "2c07d61d-75d1-4bfc-a1ff-f9df6c606d58"
              volume: "13.27"
              liquidity: "3.53"
              timestamp: 1782787459276
              points:
                - tokenId: "1516616443"
                  bestBid: "0.21"
                  bestAsk: "0.3"
                  lastPrice: "0.22"
                  timestamp: 1782787459276
            timestamp: 1782787459276
    Trade:
      name: trade
      title: 成交
      summary: 公开成交。
      payload:
        $ref: "#/components/schemas/TradeMessage"
      examples:
        - name: 成交
          payload:
            eventType: trade
            data:
              tradeId: "57655698359586817"
              tokenId: "1516616443"
              marketId: "1782787459278349659"
              eventId: "2c07d61d-75d1-4bfc-a1ff-f9df6c606d58"
              conditionId: "1515616443"
              size: "5"
              side: BUY
              price: "0.22"
              timestamp: 1782787459276
            timestamp: 1782787459276
    PriceChange:
      name: priceChange
      title: 价格变动
      summary: 市场价格更新。
      payload:
        $ref: "#/components/schemas/PriceChangeMessage"
      examples:
        - name: 价格变动
          payload:
            eventType: priceChange
            data:
              marketId: "1782787459278349659"
              conditionId: "1515616443"
              eventId: "2c07d61d-75d1-4bfc-a1ff-f9df6c606d58"
              timestamp: 1782787459276
              points:
                - tokenId: "1516616443"
                  timestamp: 1782787459276
                  price: "0.22"
                  bestBid: "0.21"
                  bestAsk: "0.3"
                  lastTradePrice: "0.22"
                  source: trade
            timestamp: 1782787459276

  schemas:
    SubscribeRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - channel
      properties:
        action:
          type: string
          enum:
            - subscribe
          description: 操作类型。
        channel:
          type: string
          pattern: "^market:[1-9][0-9]*$"
          description: 市场订阅频道，格式为 `market:<marketId>`。
          examples:
            - "market:1782787459278349659"

    UnsubscribeRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - channel
      properties:
        action:
          type: string
          enum:
            - unsubscribe
          description: 操作类型。
        channel:
          type: string
          pattern: "^market:[1-9][0-9]*$"
          description: 市场订阅频道，格式为 `market:<marketId>`。
          examples:
            - "market:1782787459278349659"

    Ping:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - PING
          description: 心跳消息类型。

    Pong:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - PONG
          description: 心跳响应类型。

    PriceLevel:
      type: object
      additionalProperties: false
      required:
        - price
        - size
      properties:
        price:
          type: string
          description: 价格。
          examples:
            - "0.21"
        size:
          type: string
          description: 数量。
          examples:
            - "3"

    BookData:
      type: object
      additionalProperties: false
      required:
        - marketId
        - tokenId
        - timestamp
        - bids
        - asks
      properties:
        marketId:
          type: string
          description: 市场 ID。
        tokenId:
          type: string
          description: 结果 Token ID。
          examples:
            - "1516616443"
        timestamp:
          type: integer
          format: int64
          description: 快照时间，Unix 毫秒。
        bids:
          type: array
          description: 买盘档位，按价格从高到低排列。
          items:
            $ref: "#/components/schemas/PriceLevel"
        asks:
          type: array
          description: 卖盘档位，按价格从低到高排列。
          items:
            $ref: "#/components/schemas/PriceLevel"

    BookMessage:
      type: object
      additionalProperties: false
      required:
        - eventType
        - data
      properties:
        eventType:
          type: string
          enum:
            - book
          description: 行情类型，固定为 `book`。
        data:
          $ref: "#/components/schemas/BookData"
        timestamp:
          type: integer
          format: int64
          description: 行情时间，Unix 毫秒。

    TickerPoint:
      type: object
      additionalProperties: false
      required:
        - tokenId
        - bestBid
        - bestAsk
        - lastPrice
        - timestamp
      properties:
        tokenId:
          type: string
          description: 结果 Token ID。
        bestBid:
          type: string
          description: 最优买价。
        bestAsk:
          type: string
          description: 最优卖价。
        lastPrice:
          type: string
          description: 最新成交价。
        timestamp:
          type: integer
          format: int64
          description: Token 行情时间，Unix 毫秒。

    TickerData:
      type: object
      additionalProperties: false
      required:
        - marketId
        - conditionId
        - eventId
        - volume
        - liquidity
        - timestamp
        - points
      properties:
        marketId:
          type: string
          description: 市场 ID。
        conditionId:
          type: string
          description: 条件 ID。
        eventId:
          type: string
          description: 事件 ID。
        volume:
          type: string
          description: 市场累计成交量。
        liquidity:
          type: string
          description: 市场流动性。
        timestamp:
          type: integer
          format: int64
          description: 行情时间，Unix 毫秒。
        points:
          type: array
          description: 各结果 Token 的行情。
          items:
            $ref: "#/components/schemas/TickerPoint"

    TickerMessage:
      type: object
      additionalProperties: false
      required:
        - eventType
        - data
      properties:
        eventType:
          type: string
          enum:
            - ticker
          description: 行情类型，固定为 `ticker`。
        data:
          $ref: "#/components/schemas/TickerData"
        timestamp:
          type: integer
          format: int64
          description: 行情时间，Unix 毫秒。

    TradeData:
      type: object
      additionalProperties: false
      required:
        - tradeId
        - tokenId
        - marketId
        - eventId
        - conditionId
        - size
        - side
        - price
        - timestamp
      properties:
        tradeId:
          type: string
          description: 成交 ID。
        tokenId:
          type: string
          description: 成交结果 Token ID。
        marketId:
          type: string
          description: 市场 ID。
        eventId:
          type: string
          description: 事件 ID。
        conditionId:
          type: string
          description: 条件 ID。
        size:
          type: string
          description: 成交数量。
        side:
          type: string
          enum:
            - BUY
            - SELL
          description: 吃单方方向。
        price:
          type: string
          description: 成交价。
        timestamp:
          type: integer
          format: int64
          description: 成交时间，Unix 毫秒。

    TradeMessage:
      type: object
      additionalProperties: false
      required:
        - eventType
        - data
      properties:
        eventType:
          type: string
          enum:
            - trade
          description: 行情类型，固定为 `trade`。
        data:
          $ref: "#/components/schemas/TradeData"
        timestamp:
          type: integer
          format: int64
          description: 行情时间，Unix 毫秒。

    PriceChangePoint:
      type: object
      additionalProperties: false
      required:
        - tokenId
        - timestamp
        - price
        - bestBid
        - bestAsk
        - lastTradePrice
        - source
      properties:
        tokenId:
          type: string
          description: 结果 Token ID。
        timestamp:
          type: integer
          format: int64
          description: Token 价格更新时间，Unix 毫秒。
        price:
          type: string
          description: 当前价格。
        bestBid:
          type: string
          description: 最优买价。
        bestAsk:
          type: string
          description: 最优卖价。
        lastTradePrice:
          type: string
          description: 最新成交价。
        source:
          type: string
          description: 价格变动来源。

    PriceChangeData:
      type: object
      additionalProperties: false
      required:
        - marketId
        - conditionId
        - eventId
        - timestamp
        - points
      properties:
        marketId:
          type: string
          description: 市场 ID。
        conditionId:
          type: string
          description: 条件 ID。
        eventId:
          type: string
          description: 事件 ID。
        timestamp:
          type: integer
          format: int64
          description: 市场价格更新时间，Unix 毫秒。
        points:
          type: array
          description: Token 价格点。
          items:
            $ref: "#/components/schemas/PriceChangePoint"

    PriceChangeMessage:
      type: object
      additionalProperties: false
      required:
        - eventType
        - data
      properties:
        eventType:
          type: string
          enum:
            - priceChange
          description: 行情类型，固定为 `priceChange`。
        data:
          $ref: "#/components/schemas/PriceChangeData"
        timestamp:
          type: integer
          format: int64
          description: 行情时间，Unix 毫秒。
